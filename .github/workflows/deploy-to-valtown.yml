name: Deploy to Val Town

on:
  workflow_dispatch:
    inputs:
      legacy_ref:
        description: "Pre-Cloudflare Val Town-compatible commit SHA"
        type: string
        required: true

concurrency:
  group: deploy-to-val-town
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.legacy_ref }}

      - name: Check legacy deployment inputs
        run: test -f deno.json && test -f .vt/state.json && test ! -f cloudflare.config.ts

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install vt CLI
        run: deno install -gArf jsr:@valtown/vt@0.1.56

      - name: Push to Val Town
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: vt push
